name: Release

# Publishes @weaver-engineering/gate-checks and @weaver-engineering/task-phases
# to GitHub Packages via Changesets. Pushes to main open/update a "Version
# Packages" PR when there are pending changesets; merging that PR consumes
# them and publishes instead. See CLAUDE.md's "Releasing" section for how to
# cut a release.

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build every package
        run: pnpm -r build

      - name: Version or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Surface the Version Packages PR in simonemmott's PR list
        # changesets/action's PR is authored by github-actions[bot] -- since
        # that's neither the author, assignee, reviewer, nor a mention for
        # a human, it doesn't show up in github.com/pulls even though it
        # needs a human merge (only humans may approve PRs here). Only set
        # when this run opened/updated a PR rather than publishing.
        if: steps.changesets.outputs.pullRequestNumber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ steps.changesets.outputs.pullRequestNumber }}" \
            --add-reviewer simonemmott --add-assignee simonemmott
